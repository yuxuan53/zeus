    pk_col: state_id
    required_columns:
      # nullable:true is correct SQLite semantics, not a data promise: a
      # TEXT PRIMARY KEY (unlike an INTEGER PRIMARY KEY rowid alias) does NOT
      # get an implicit NOT NULL from SQLite (PRAGMA table_info reports
      # notnull=0) -- verified directly, not assumed. The application always
      # populates it (insert_state's positional INSERT has no way to omit
      # it); this column just declares what SQLite itself enforces.
      - {name: state_id, type: TEXT, nullable: true}
      - {name: family_id, type: TEXT, nullable: false}
      - {name: content_hash, type: TEXT, nullable: false}
      - {name: hash_version, type: INTEGER, nullable: false}
