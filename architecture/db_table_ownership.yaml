  # ---------------------------------------------------------------------------
  # PR-S4b (2026-05-18): world-side manifest gap closure.
  # These 13 tables appear on zeus-world.db but were not declared in the registry,
  # causing assert_db_matches_registry(WORLD) to fail at daemon boot.
  #
  # Two sub-categories:
  #   A) Active world-class writers (2 tables): still written by src/ code.
  #   B) Legacy/archived tables (11 tables): frozen data, no active writer.
  #
  # All legacy_archived entries are EXCLUDED from set-equality per §1.5.
  # Drop date: 2026-08-09 (parity with K1 90-day retain window).
  # ---------------------------------------------------------------------------

  # --- Category A: subsystem-owned tables (created lazily by owning module, not init_schema) ---
