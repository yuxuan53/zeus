  - name: settlement_attribution
    db: world
    schema_class: world_class
    schema_version_owner: SCHEMA_VERSION
    created_by: init_schema
    pk_col: attribution_id
    required_columns:
      - {name: attribution_id, type: TEXT, nullable: false}
      - {name: position_id, type: TEXT, nullable: false}
      - {name: category, type: TEXT, nullable: false}
      - {name: won, type: INTEGER, nullable: false}
      - {name: counts_as_skill_win, type: INTEGER, nullable: false}
      - {name: graded_at, type: TEXT, nullable: false}
      - {name: schema_version, type: INTEGER, nullable: false}
    notes: >
      Skill-vs-luck grade ledger (2026-06-12, operator skill-not-luck law). One
      row per SETTLED position graded into a typed category (SKILL_WIN /
      LUCKY_WIN / SKILL_LOSS / MISCALIBRATED_LOSS / STALE_DECISION /
      UNATTRIBUTABLE_Q_MISSING) by comparing our position + decision-time q +
      freshest settlement-eve data + the settled outcome + market price. The
      decision-time q is the IMMUTABLE ActionableTradeCertificate q (resolved via
      the audit row's expected_edge_source_certificate_hash, 2026-06-21
      lifecycle-alpha); when that cert is unresolvable the position grades
      UNATTRIBUTABLE_Q_MISSING and is never SKILL/LUCK (the category CHECK is
      upgraded in place by a guarded rebuild for pre-existing live tables). A
      LUCKY_WIN (won but our own freshest data disagreed — the Denver-if-92 shape)
      counts as a MISS in skill accounting so a lucky win can no longer masquerade
      as system health. The skill win-rate =
      SKILL_WIN / (SKILL_WIN + LUCKY_WIN + SKILL_LOSS + MISCALIBRATED_LOSS).
      Sole writer = src/analysis/settlement_skill_attribution.py (the daily
      attribution job wired in src.main, runs after settlement harvesting,
      idempotent per position via UNIQUE(position_id)). NO daemon_writer field:
      the job runs in the trading daemon (src.main), not src.ingest_main, so it
      is out of assert_writer_jobs_registered's ingest-only scope (same posture
      as settlement_guard_report). Append/upsert-only audit
      evidence; never a venue command, order truth, settlement truth, or
      calibration training input.
      LX-E packet (2026-07-13): gained world_grade_pnl_usd — a hold-to-settlement
      world-grade P&L label derived from settlement payoff + fill economics
      (NEVER actual chain-realized wallet P&L; the name says what it is). Replaces
      the removed writeback_settlement_pnl_to_audit, which used to write this
      value into edli_live_profit_audit.pnl_usd inside the SAME savepoint as
      grading — a forbidden world-grade/chain-money collapse per the adjudication.
      persist_grade now archives the prior row into
      settlement_attribution_supersessions (append-only) before any re-grade
      UPDATE — see that table's entry.
      READ CONTRACT for fresher_cycle_existed_at_decision (2026-07-27): the
      column holds TWO incompatible meanings under one literal 1. Rows graded
      before src/analysis/settlement_skill_attribution.STALE_PREDICATE_FIX_LANDED_AT
      came from the discredited predicate (settlement-eve vs time-reconstructed
      decision posterior) and their 1s are systematically false — 266/266
      joinable flagged rows had that "fresher" posterior computed AFTER their own
      POSITION_OPEN_INTENT (median +26.8h). schema_version does NOT distinguish
      them: it is 1 on every row and tracks table shape, never predicate
      identity. graded_at is the discriminator — filter with
      fresher_flag_is_trustworthy(graded_at), never the literal 1 alone.
      The affected rows are deliberately NOT re-graded: 203 carry a q_live that
      is the last copy of that decision's belief after the 2026-07-24
      certificate deletion, and a re-grade would resolve 38 while destroying 165
      into UNATTRIBUTABLE_Q_MISSING. Whether to re-grade is an operator decision.

