      (SKILLFUL_REVERSAL_EXIT) instead of grading like a held loss, and a premature
      exit is penalized (PREMATURE_EXIT_COST). Entry-independent (entry_cost
      cancels) so realized_pnl = hold_counterfactual_pnl + exit_alpha_usd with no
      double-counting. Categories: SKILLFUL_REVERSAL_EXIT / PREMATURE_EXIT_COST /
      LUCKY_EXIT_SAVED_LOSS / NEUTRAL_EXIT / ADMIN_OR_RISK_EXIT_VALUE_DELTA /
      EXIT_UNATTRIBUTABLE_{SETTLEMENT,PROCEEDS,Q}_MISSING (category CHECK upgraded in
      place by a guarded rebuild for pre-existing live tables). Sole writer =
      src/analysis/exit_timing_attribution.py (the exit-timing pass of the
      settlement attribution job in src.main; idempotent per position via
      UNIQUE(position_id)). NO daemon_writer field (runs in the trading daemon, not
      src.ingest_main — same posture as settlement_attribution). Append/upsert-only
      audit evidence; never a venue command, order truth, settlement truth, or
      calibration training input.

