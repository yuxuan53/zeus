files:
  src/AGENTS.md:
    zone: docs
    authority_role: registry
    why: Source-root navigation and zone summary.
  src/__init__.py:
    zone: package_marker
    authority_role: package_marker
    why: Marks src as importable package.
  src/main.py:
    zone: K2_runtime
    authority_role: live_daemon_entry
    why: Live-only daemon entry point. Its targeted executable snapshot refresh now passes per-row trade write coordinator leases into market_scanner instead of holding the legacy trade writer lock around CLOB refresh; runtime snapshot freshness checks use executable_market_snapshot_latest before falling back to the append log. The 10-minute chain-mirror backstop is non-deferrable because it refreshes upstream holdings authority before a short serialized trade-DB transaction; active entry, redecision, or monitor consumers cannot starve chain_seen_at past its fail-closed bound. Incomplete exact held-SELL completion debt snapshots all currently queued exact wake IDs for one fair non-held selection turn without acknowledging or weakening the durable debt. Canonical held-monitor cadence debt present at reactor admission becomes an exact-family BUY block (global BUY block only when scope is unreadable), while transient monitor fairness/handoff remains the only global admission preemption and newly emerging mid-cut debt still cancels the replayable cut. Capital-blocking cancel recovery keeps the shared reactor admission fence through its exact venue snapshot and DB apply, so a newly admitted auction cannot repeatedly defeat the debt's RESET after the scheduler already reserved the handoff; an exact persisted screen-cancel obligation bypasses monitor yield even when scoped to one market, so a live CANCEL_PENDING rest cannot be starved before venue dispatch. At boot it installs the process-local collateral singleton as a read-only validated consumer of the sidecar's pre-migrated snapshots, never as a schema writer.
  src/ingest_main.py:
    zone: K2_runtime
    authority_role: ingest_daemon_entry
    why: Data-ingest daemon entry point. Schedules all K2 observation/forecast/settlement/UMA ingest ticks independent of the trading daemon. The active source-clock owner sends ordinary anchor capture through the reserved priority quota lane, including source-commit partitions, and an unchanged-clock tick first measures exact-cycle per-scope anchor gaps then drains only a proven residual; a global source high-water or advanced metadata cursor cannot strand the rest of the city universe. Periodic replacement maintenance reserves a bounded half-tick for held-first BPF capture whenever held exposure and an admitted provider lane coexist, so anchor backlog cannot permanently starve the current shape required for held q. The HKO finalized prior-day Daily Extract has a dedicated five-minute poll with its own advisory lock, so WU batch latency or failure cannot delay post-local-day held-position authority; its read-only presence check and provider fetch happen before one non-blocking short cross-DB commit, never under canonical writer flocks. The realtime HKO source clock remains a separate monitoring role. No imports from src.engine, src.execution, src.strategy, src.signal, src.control, or src.main.
    downstream:
    - src/data/daily_obs_append.py
    - src/data/hourly_instants_append.py
    - src/data/forecasts_append.py
    - src/data/solar_append.py
    - src/ingest/harvester_truth_writer.py
    - src/state/uma_resolution_listener.py
    - scripts/etl_forecast_skill_from_forecasts.py
  src/data/day0_fast_obs.py:
    zone: K1_truth
    authority_role: same_station_day0_physical_clock
    why: Appends same-station METAR prints and emits authorized Day0 redecision events. WU-settled cities use the audited same-station distribution contract and a causal seven-day signed WU-minus-METAR residual likelihood with an explicit zero-hit unknown tail; this probability witness never becomes settlement truth. NOAA-settled Istanbul/Moscow/Tel Aviv consume the direct NOAA/NWS publication for their configured settlement station while Ogimet remains the canonical hourly/history mirror. Equivalent raw-METAR renderings collapse to their earliest causal publication before the absorbing extreme and source observation version advance, so a duplicate writer cannot mint a second conditioning identity or promote the monitoring channel to final settlement truth.
    downstream:
    - src/ingest_main.py
    - src/events/triggers/day0_extreme_updated.py
  src/data/replacement_forecast_live_materialization_queue.py:
    zone: K2_runtime
    authority_role: replacement_live_materialization_queue
    why: Live replacement forecast queue runner; drains live seed/request files into the materializer on the forecast DB using runtime_layer='live' semantics. The queue admits exactly one commit subprocess because all materializations share one SQLite writer; parallel commits multiply cold-page reads and lock contention without adding write throughput. Every child retains the global 30-second outer timeout and receives a queue-owned absolute deadline one second earlier. Its non-canonical atomic stage receipt records open/read snapshot, prepare/fusion, dependency witness, write/verify, or wake. SQLite VM progress and a generation-fenced independent watchdog both enforce that deadline, so one blocking VFS read is interrupted and becomes typed DEFERRED evidence before the outer kill; the same enforcement wraps caller-provided batch connections. Receipt moves atomically rewrite input_json to the current request pathname while retaining the stable request_id. A timeout is requeued with per-family exponential backoff, so an expensive or contended family cannot stop current posterior generation for unrelated cities or be discarded as a permanent probability failure. An exact claim-time chain-confirmed family whose held monitor q is stale receives a one-second retry only when its request is a Day0 observation-advance with a complete conditioning identity and remains within a three-attempt, 75-second cumulative stale-q budget. It never bypasses retry_at or receives a longer subprocess deadline; a fresh q removes the special tier immediately, and exhausted retry budget restores ordinary exponential priority, so one impossible family cannot monopolize the writer. Any structured BLOCKED result is terminal for its exact request/current-input/logic fingerprint and is retried only when that fingerprint changes; a specific missing-authority reason therefore cannot be misclassified as a generic failure and repeatedly consume the sole writer. A recent successful commit suppresses another subprocess only for a fixed non-sliding short window and only while the exact request/current-input/logic fingerprint is unchanged; a new provider, ENS, Day0 observation, file, logic revision, or window expiry immediately restores normal computation. Claim-time chain-confirmed exposure is the priority-class authority; current-capital seed filenames are stable-partitioned ahead of ordinary backlog before the bounded inspection window, so the bound cannot erase that priority, while the durable cursor still advances the remainder. Each class then has newest-queued-source-cycle and older-cycle subtiers. Within one source-cycle scope an exact canonical SUCCESS baseline precedes an anchor-first stale baseline, after which request computed_at FIFO applies rather than an unrelated historical enqueue marker. A second source-cycle boundary check immediately before request build/subprocess skips work below the family's current posterior/eligible ENS HWM and defers work above the eligible ENS HWM; neither stale requests nor deterministic cycles that cannot yet construct a same-cycle ENS shape may consume the sole writer. A future-of-ENS producer-owned seed stays pending in place, preserving exact-family deduplication across recovery, cycle-advance, and fusion-upgrade producers; while that boundary is active, duplicate coalescing cannot move an exact producer-owned path out from under its durable marker. The one-second queue cadence rechecks the retained debt and equality with the later ENS HWM resets both the defer and normal coalescing without a new file. Unreadable HWM state preserves the original materializer path. The bounded seed window applies the request semantic key plus exact seed producer authority and latest-computed-at order before the one-seed admission limit, so an older identical unfenced seed cannot consume the only writer slot merely because duplicates otherwise reach the request stage on different polls; upgrade triggers never coalesce across authority classes, and Day0 cycle-owner seeds stay under their exact canonical ownership fence. Discovery receives the actual configured request and inflight paths, so exact-family pending-work deduplication remains correct when queue directories do not share a parent. Its seed/request coalescing key includes the full Day0 conditioning identity (source, microsecond observation time, observed extreme, unit), so a same-cycle canonical observation correction cannot be discarded as a duplicate before posterior provenance records it. Replaces retired blocked-materialization queue code so live production no longer imports a blocked-labeled implementation.
    hazards:
    - SOURCE_TRUTH_PLANE_COLLAPSE
    - VENUS_CONTROL_ONLY
    downstream:
    - src/data/replacement_forecast_production.py
    - scripts/materialize_replacement_forecast_live.py
    - tests/data/test_replacement_cycle_availability.py
  src/data/replacement_cycle_advance_trigger.py:
    zone: K2_runtime
    authority_role: day0_conditioning_reseed_liveness
    why: Persists cycle-advance markers and Day0 reseed work. A Day0 marker is completion evidence only when its durable full conditioning identity matches the latest canonical fact and either an identical seed remains in flight or the current live posterior provenance consumed that identity; a same-model-cycle canonical Day0 identity advance re-enters this bounded poll lane. When deterministic manifests are ahead of the latest decision-time-eligible same-metric ENS, the observation revision reconditions the last ENS-complete carrier immediately instead of waiting on an incomplete future shape; normal cycle advance later replaces it. When an exact ENS source run commits after the deterministic anchor for the same target cycle, the old marker seed may be replaced only if its pinned baseline run differs, the committed run belongs to that exact cycle, no active request owns the old seed, and the marker path still matches under CAS.
    hazards:
    - SOURCE_TRUTH_PLANE_COLLAPSE
    - STALE_BELIEF_AUTHORITY
    downstream:
    - src/data/replacement_forecast_live_materialization_queue.py
    - src/data/replacement_forecast_materializer.py
    - src/engine/event_reactor_adapter.py
  src/data/day0_hourly_vectors.py:
    zone: K2_runtime
    authority_role: day0_remaining_window_forecast_vectors
    why: Persists fresh target-day hourly forecast vectors in zeus-forecasts.db and derives only the interval not yet covered by the latest causal settlement-channel observation. Vector freshness stays bound to decision time; the observation clock only defines the remaining stochastic window, including a terminal tail after local midnight. Decision/cutoff clocks remain causal provenance but are excluded from the carrier economic content hash and deterministic sampling seed once the selected future vector, observation likelihood, sigma, bins, and source identities are unchanged, so a no-new-information refresh cannot manufacture a new q or starve held-SELL coverage. The current global bundle retains ECMWF, ICON, JMA, and UKMO hourly paths so a city outside regional-model domains cannot collapse Day0 probability to one deterministic provider. The Day0 carrier validates complete settlement coverage in thermal order but emits q in the venue candidate order, so a valid family cannot lose probability authority merely because Gamma presents its bins non-monotonically.
    hazards:
    - SOURCE_TRUTH_PLANE_COLLAPSE
    downstream:
    - src/events/reactor.py
    - src/engine/event_reactor_adapter.py
    - src/engine/monitor_refresh.py
  src/data/day0_observation_reader.py:
    zone: K2_runtime
    authority_role: day0_current_observation_and_revision_likelihood_reader
    why: Reads source-typed current-day extrema without mixing provider roles. Only WU changed-payload observation_revisions that the writer actually applied to canonical observation state provide the causal, conservative Jeffreys estimate that the current hourly boundary survives through the remaining source updates; quarantined payload mismatches are disagreement evidence and never become probability transitions. This uncertainty stays inside q and prevents a revisable WU print from becoming exact payoff authority. If a city has zero applied changed-payload transitions in the bounded lookback, the Jeffreys zero-observation prior is available only to HELD_MONITOR/REDUCE_ONLY_EXIT so existing capital remains re-decidable; ENTRY still requires empirical history and fails closed.
    hazards:
    - SOURCE_TRUTH_PLANE_COLLAPSE
    downstream:
    - src/engine/event_reactor_adapter.py
    - src/engine/monitor_refresh.py
  src/data/replacement_current_value_serving.py:
    zone: K2_runtime
    authority_role: replacement_current_value_serving_selector
    why: Single read-time authority for the deterministic provider value possessed at one carrier-bound or source-clock decision cut. It prefers current same-product single-runs evidence, admits only explicitly branded eligible previous-runs substitution, rejects future, over-age, and ECMWF ifs025-to-9km product mismatch, and keeps provider-value time separate from the ENS shape-carrier clock.
    hazards:
    - SOURCE_TRUTH_PLANE_COLLAPSE
    downstream:
    - src/data/replacement_forecast_materializer.py
    - src/data/replacement_forecast_production.py
  src/data/replacement_forecast_materializer.py:
    zone: K2_runtime
    authority_role: replacement_forecast_posterior_writer
