    zone: K2_runtime
    authority_role: venue_command_recovery
    why: >-
      Scans unresolved durable venue commands and appends recovery events without bypassing command grammar. Mixed-token repair delegates its exact command/execution-fact rehome CAS and provenance to the typed venue_command_repo seam; an EDLI absorbed-fill marker suppresses generic reprojection only when proof hash, position, and current canonical aggregate all match. Confirmed maker fills become execution facts while their ACKED remainder is still resting, even when the initial LIVE order fact still reports zero matched; maker cancel races likewise aggregate all canonical confirmed trade legs for one order. A cancelled partial ENTRY discovered after a later authenticated SELL backfills immutable command-level acquisition provenance only when complete entry-minus-exit flow already reproduces the current residual, so recovery cannot resurrect released capital; if that late acquisition exposes a stale full-exit prefix, exact pre-exit entry-minus-exit flow plus a synced residual recovers the true holding and books the already-filled reduction without manufacturing closure. A fully matched FOK/FAK BUY whose trade feed rounded price may also reprice its current local capital basis from the command-bound final submission envelope, while preserving separately observed Chain economics. Authenticated terminal zero-fill order truth also expires a SUBMITTING command whose ACK event was lost, releasing only that command commitment while preserving any older same-position fill. Recovered partial SELLs fold each authenticated trade identity exactly once against an immutable pre-recovery lot baseline; canonical cumulative fills, order aggregate, and fresh residual must conserve, dust remains pending with a typed non-family-blocking review item, and no partial leg can manufacture economic closure. A later authenticated fill supersedes and clears a voided retry placeholder on the same execution intent. A later terminal close adds that exact partial fold to the remaining-lot terminal economics and rounds only once, so restart projection cannot overwrite earlier realized gains or losses. A terminal FAK partial-reduction releases its mutex only when the command/order-bound economic-fill projection and a later synced Chain observation agree on the total remaining position; the unfilled command prefix is never confused with total held exposure. An ACKED/POST_ACKED EXIT on a hard-terminal position remains a restart recovery candidate when canonical confirmed trade facts prove a partial fill: exact point-order absence, complete open-order absence, and matching authenticated account trades expire only its unfilled GTC remainder while leaving the terminal position unchanged. Already-realized venue fill facts in the probability domain are projected even when their price is outside the new-order action band; that observation cannot authorize another out-of-band command. Authenticated terminal zero-fill evidence expires only that command commitment without voiding an older same-position fill, and a shared command/order invariant forbids every terminal zero-fill append when canonical order truth already records any finite positive matched size; trade-list absence cannot negate that fact. A terminal partial ENTRY whose raw terminal fact still carries the cancelled remainder stays in the command-scoped terminalizer even after its position becomes economically closed. Its exposure obligation releases only after canonical terminal-order and positive-fill proof plus either an exact current residual or a canonical full EXIT with zero Chain exposure reproduce the entire entry-minus-exit flow; command state or local phase alone never releases capital. A global MAKER_REST held SELL atomically writes the existing V4 fresh-auction obligation before release. V4 keeps position/family/held-token/SELL debt scope and generation stable while q/book content is an attempt witness; append-only receipt lineage admits concurrent witnesses without allowing an old receipt to complete or roll back the newest durable attempt. Both its missing terminal-fact materialization and late local-orphan RESET are command-scoped and cannot depend on the aggregate position being empty, because other orders may own its existing shares. Deploy-time restart recovery runs that same point-order terminal proof before its read-only alignment gate and gives complete account pagination a separately bounded large-account deadline, while the scheduled live tick retains its short cadence budget. A point-in-time account snapshot never clears a post-submit unknown by token-level absence: without a command/order/trade/terminal-order fact causally bound to the original submit, duplicate and cap authority stay fail-closed; a complete exact-ID absence may detach only older same-market terminal commands already carrying unresolved exchange-ghost obligations, then atomically clear only the absent command's local-orphan debt. Terminal positive-fill EXIT remainders are selected by one shared candidate law; command recovery alone releases them while atomically persisting the V4 held-sell reauction obligation. Boot invalid-entry authority recovery ranks canonical order facts only for zero-exposure pending ENTRY commands, so historical fact volume cannot delay scheduler and held-position monitor startup. B71 additionally detects one open position_id carrying authenticated FILLED ENTRY BUY commands for multiple native held tokens, then in one append-first transaction reconstructs token-typed projections, rehomes only child commands/facts with CAS, and fails closed to review on topology, certificate, lifecycle, attribution, or rehome ambiguity; it never submits a venue action.
    cancel_fill_race: >-
      A CANCEL_PENDING entry whose current point/order fact proves a terminal
      full match crosses the existing REVIEW_REQUIRED proof boundary before
      FILLED, atomically preserving the realized fill, position increment,
      execution fact, and collateral conversion. A partial or nonterminal
      match remains pending.
    cancel_lease: >-
      Screen cancel recovery uses an exact versioned obligation marker and a
      CANCEL_PENDING self-transition lease claimed with fresh authenticated
      point-order truth. The network call runs without a DB connection held;
      post-cancel ACK/unknown finalization is fenced by state, last_event_id,
      and attempt_id so stale workers cannot finalize a newer generation.
