schema_version: 1
metadata:
  created: '2026-04-13'
  owner_packet: Packet 4 source file rationale map
  note: 'Per-file rationale map for tracked src/** files. This file indexes why source files exist and what they protect;
    it does not override zones.yaml.

    '
hazard_badges:
  DERIVED_ONLY: Derived output/read model; never canonical truth.
  NO_WRITE_PATH: Must not write canonical truth.
  VENUS_CONTROL_ONLY: External writes must flow through Venus/control contracts.
  TRANSITIONAL_DO_NOT_DEEPEN: Transitional compatibility surface; do not deepen dependency.
  SOURCE_TRUTH_PLANE_COLLAPSE: Source roles must not collapse settlement, Day0, hourly, and forecast truth planes.
  DOUBLE_FORECAST_PRODUCER: More than one live OpenData forecast producer can write the same source/run authority chain.
  WMO_ROUNDING_LAW: Settlement-aligned values must use WMO half-up.
  ORACLE_TRUNCATION_BIAS: HKO/Oracle truncation differences must stay explicit and may not be silently mixed with WMO half-up.
  CALIBRATION_FAMILY_MIXING: Calibration rows must keep metric, cluster, season, source identity, and promotion evidence explicit.
  NOT_DAEMON_WIRED: Module exists in src/ but is not imported from any daemon hot-path file (src/main.py, src/ingest_main.py, src/engine/*, src/execution/*, src/state/db.py runtime callers, scripts/healthcheck.py healthy predicate). Daemon activation happens in a separate operator-controlled commit, not by anyone who happens to need the module.
  SOURCE_INGEST_SCHEMA_DRIFT: Ingest payload contract has drifted from the declared schema; mx2t6/mn2t6 field shapes, causality evidence, or boundary markers must be re-verified before merging new ingest paths.
  LOW_HIGH_METRIC_MIXING: High and low temperature metric families must never be mixed in a single ingest payload; each payload must carry an explicit metric identity tag.
  MULTI_BIN_MUTUALLY_EXCLUSIVE_OVERALLOCATION: Weather market bins for one city/date/metric family are mutually exclusive outcomes; live entry selection must not treat multiple bins as independent scalar bets.
write_routes:
  canonical_position_write:
    owner: src/state/ledger.py
    projection: src/state/projection.py
    lifecycle_gate: src/state/lifecycle_manager.py
  control_write:
    owner: src/control/control_plane.py
    external_contract: src/supervisor_api/contracts.py
  settlement_write:
    owner: src/execution/harvester.py
    rounding_law: src/contracts/settlement_semantics.py
    db_gate: src/state/db.py
    # Settlement writes are authoritative only through the current harvester
    # path and SettlementSemantics.assert_settlement_value.
  offline_replay_write:
    owner: src/engine/replay.py
    db: state/zeus_backtest.db
    authority_scope: offline_no_promotion
  calibration_persistence_write:
    owner: src/calibration/store.py
    tables:
    - calibration_pairs
    - platt_models
    guardrail: Settlement values must use WMO helper; decision_group_id must stay stable.
  calibration_decision_group_write:
    owner: src/calibration/effective_sample_size.py
    tables:
    - calibration_decision_group
    - calibration_pairs
    guardrail: Additive/blocked accounting only until promoted by a governance packet.
  decision_artifact_write:
    owner: src/state/decision_chain.py
    tables:
    - decision_log
    guardrail: Decision artifacts are evidence/read-model facts, not lifecycle authority.
  day0_monitoring_fact_write:
    owner: src/state/day0_metric_fact_store.py
    tables:
    - day0_metric_fact
    guardrail: Day0 monitor facts are durable audit evidence only; they must not bypass forecast_posteriors, hard-fact exit gates, or source-policy validation.
  venue_command_write:
    owner: src/state/venue_command_repo.py
    tables:
    - venue_commands
    - venue_command_events
    guardrail: Command event append and collateral reservation terminal-release must remain atomic.
  data_daemon_job_run_write:
    owner: src/state/job_run_repo.py
    tables:
    - job_run
    guardrail: Data-daemon scheduler provenance must preserve scheduled window, status, source identity, affected scope, and readiness impact.
  data_daemon_source_run_write:
    owner: src/state/source_run_repo.py
    tables:
    - source_run
    guardrail: Forecast producer runs must preserve release-calendar provenance, cycle time, capture time, completeness, and metric/source identity.
  data_readiness_write:
    owner: src/state/readiness_repo.py
    tables:
    - readiness_state
    guardrail: Missing, expired, or mismatched readiness must fail closed; live entry may consume readiness evidence but must not direct-fetch source data.
  market_topology_state_write:
    owner: src/state/market_topology_repo.py
    tables:
    - market_topology_state
    guardrail: Venue topology freshness must stay separate from forecast-source readiness and cannot authorize live trading alone.
  script_repair_write:
    owner: scripts/**
    guardrail: dry-run/apply metadata required in later scripts manifest packet
# External provider registry — consumed by scripts/ci/check_source_rationale_delta.py.
# Merged 2026-05-27: union of PR #347 (Finding 10 — daemon-entry providers) and
# PR #348 (market-cost-seam — evaluator/cycle_runtime providers). Map form keyed
# by provider id; the gate reads the keys as the set of declared sources. Both
# PRs independently added a `providers:` block to satisfy the same gate; this
# resolution keeps every declared id under the single canonical map.
providers:
  observation:
    role: settlement_capture_observation
    client: src/data/observation_client.py
    why: Hourly+daily observed-temperature observations (HKO/NOAA/WU/Ogimet);
      used by Day0 monitor + settlement capture truth chain. Per-station
      routing law in architecture/observation_routing.yaml.
  polymarket:
    role: venue_clob
    client: src/data/polymarket_client.py
    why: Polymarket CLOB venue — orderbook + balances + order submission.
      Sole venue producer for chain truth; see architecture/venue_law.yaml
      for the canonical chain-truth contract. NOT a forecast/settlement source.
  ensemble:
    role: forecast_skill
    client: src/data/ensemble_client.py
    why: TIGGE / OpenData ensemble forecast distributions used for skill
      computation + Day0 calibration. Distinct from observation (settlement
      truth) and polymarket (venue truth) per source-plane-collapse rule.
  ecmwf_open_data:
    role: forecast_skill_live
    client: src/data/ecmwf_open_data_ingest.py
    why: Cycle-aligned live forecast producer (00z / 06z / 12z / 18z). (PR #348)
  tigge:
    role: forecast_skill_historical
    client: src/data/tigge_client.py
    why: 51-member ENS historical archive for Platt fit. (PR #348)
  meteostat_bulk:
    role: historical_hourly_archive
    client: src/data/meteostat_bulk_client.py
    why: Long-horizon historical hourly archive backfill. (PR #348)
  ogimet_hourly:
    role: historical_hourly_archive
    client: src/data/ogimet_hourly_client.py
    why: Secondary historical hourly archive (ogimet provider). (PR #348)
  openmeteo:
    role: forecast_or_observation_complementary
    client: src/data/openmeteo_client.py
    why: Open-Meteo direct client (separate from observation_client composite). (PR #348)
  wu_hourly:
    role: historical_hourly_archive
    client: src/data/wu_hourly_client.py
    why: WeatherUnderground hourly archive feed. (PR #348)
  scheduler:
    role: internal_adapter
    client: src/data/scheduler_adapter.py
    why: Internal scheduling adapter. NOT an external truth source. (PR #348)
  forecast:
    role: forecast_infrastructure
    client: src/data/forecast_source_registry.py
    why: Internal forecast infrastructure module — registry, ingest protocol, extrema authority, DB fetcher. Not an external truth source; coordinates routing between ecmwf_open_data and tigge providers. (PR #359)
  bayes_precision_fusion_history:
    role: forecast_skill_historical
    client: src/data/bayes_precision_fusion_history_provider.py
    why: >
      Walk-forward historical forecast residuals for BAYES_PRECISION_FUSION-Bayes fusion (previous_runs
      endpoint only, target_date < decision_date, VERIFIED settlement). Intra-DB JOIN
      on zeus-forecasts.db (raw_model_forecasts + settlement_outcomes). Not an
      external network source; reads Zeus's own persisted forecast history.
  station_forecast:
    role: forecast_skill_live_station
    client: src/data/station_forecast_adapter.py
    why: >
      Config-routed official station forecast ingest for CWA/HKO station values,
      called from replacement_forecast_production. These rows are forecast-skill
      inputs to source-clock precision fusion only; they are not settlement,
      Day0 observation, hourly-history, or venue truth. Per-source failures are
      fail-soft and must not silently substitute settlement/source authority.
  polymarket_gamma:
    role: internal_probe
    client: src/data/station_migration_probe.py
    why: >
      Polymarket gamma API probe for station-migration drift detection only.
      Compares Polymarket market resolution URLs against config/cities.json::wu_station;
      writes alerts when they diverge. Operator-only tooling — not on any live daemon
      hot-path and never a forecast/settlement/calibration source.
  price_channel:
    role: venue_clob_fact_stream
    client: src/ingest/price_channel_ingest.py
    why: >
      P3 live price/user channel ingest lane for Polymarket CLOB/user-channel
      facts. Produces execution_feasibility_evidence and durable fill bridge
      rows for the order daemon to read; it is venue fact input only, not a
      forecast, settlement, or calibration authority.
