  src/solve/solver.py:
    zone: K2_runtime
    authority_role: decision_logic
    why: >
      The joint SOLVE: solve() maximizes robust (band-α-quantile) expected Δlog-wealth of the
      whole stake vector over a ScenarioSet against WealthByOutcome as endowment — generalizing
      payoff_vector's 1-D robust ΔU to a plan over the route menu — then κ-scales and discretely
      repairs (re-evaluating the rounded plan; submit-worthy only if ΔU still > 0). Deterministic
      coordinate ascent, seeded at the best single item so it provably dominates the top-1 picker.
      The current global one-order path scores held-token SELL as a venue-cent partial-reduction
      optimization against HOLD at the exact nearest-tick post-only maker price. Its common capital
      comparison binds measured fill probability, finite rest deadline, and the no-fill horizon;
      current BID depth is price provenance, never fictitious immediate-fill capacity.
      BUY and SELL branch wealth use one shared spendable-cash floor plus exact same-family lower
      payoffs; unrelated held-token upside cannot be coupled only to one candidate branch. A global
      BUY's capital ceiling is the allocation witness's remaining BUY capacity, distinct from venue
      cash, while SELL/HOLD remain feasible after that allocation is exhausted. A global
      BUY candidate also carries the same captured native bid levels as its executable ask curve;
      bids are execution-policy provenance, never a second probability or objective authority.
      A taker BUY is sized from executable ask depth and binds its capital horizon through
      settlement; missing current same-token bids cannot erase that explicit hold-to-settlement
      proposal. Maker-rest BUY remains bounded by current pre-cliff liquidation capacity because
      adverse-selection fill is its own distinct execution proposal.
      SELL scoring rejects any maker proposal whose exact unit price is outside the absolute live
      price band. An immediate SELL may consume counterparty depth up to probability-domain one
      through an independently in-band submitted floor; quote economics never become permission
      to persist or submit an above-band limit. Command persistence, submit envelope, SDK boundary,
      and fill journal remain independent cumulative checks and may not be waived by the scorer.
