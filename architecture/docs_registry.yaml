schema_version: 1
metadata:
  created: '2026-04-21'
  owner_packet: docs reclassification P0
  purpose: 'Machine-readable classification for tracked docs surfaces. This registry tells agents whether a doc is law, canonical reference, live operations, evidence, archive interface, or a temporary extraction source.

    '
required_entry_fields:
- path
- doc_class
- default_read
- direct_reference_allowed
- current_role
- canonical_replaced_by
- next_action
- lifecycle_state
- coverage_scope
- parent_coverage_allowed
- truth_profile
- freshness_class
- supersedes
- superseded_by
- may_live_in_reference
- contains_volatile_metrics
- current_tense_allowed
- refresh_source
# Optional fields: Phase-2 backfill to legacy_reference and authority entries deferred.
# These are documented here so topology_doctor and schema consumers know they exist
# but do NOT reject entries that omit them.
optional_entry_fields:
- topic_authority
- superseded_chain
allowed_doc_classes:
- router
- authority
- reference
- legacy_reference
- module_reference
- operations
- runbook
- report
- artifact
- checklist
- archive_interface
- extraction_source
- package_input
allowed_next_actions:
- keep
- extract_then_move
- extract_then_reassess
- move_to_operations
- demote_after_extraction
- archive_after_closeout
- retain_as_evidence
allowed_lifecycle_states:
- durable
- active
- temporary
- transitional
- historical
- closed
allowed_coverage_scopes:
- exact
- descendants
parent_coverage_allowed_patterns:
- docs/reference/legacy/
- docs/operations/task_*/
- docs/archive/2026-Q2/task_*/
- docs/archive/2026-Q2/
- docs/operations/[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]_*/
- docs/operations/*_package_*/
- docs/operations/current/
- docs/reference/lessons/
- docs/review/
- docs/methodology/
- docs/operations/
- docs/artifacts/
- docs/reference/legacy/
